h1{margin:0;text-align:center;color:var(--coral);font:700 28px Yomogi,"Zen Maru Gothic",sans-serif;letter-spacing:.08em}h1::before{content:"✦ ";color:var(--yellow)}h1::after{content:" ✦";color:var(--mint)}

.song{display:grid;grid-template-columns:32px 38px minmax(0,1fr) 92px 38px 38px;gap:7px;align-items:center;padding:12px 0;border-bottom:1px dashed #eadfd2;cursor:pointer}.song:last-child{border-bottom:0}.song.active{margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px;background:#fff7d7}.song .field{min-width:0}.song .field:first-of-type{font-size:14px}.song .field:first-of-type input{padding:13px 14px;font-size:18px;font-weight:700}.song-number{align-self:center;color:var(--coral);font:700 18px Yomogi;text-align:center}.icon-btn,.add-btn,.reset-btn,.confirm-btn{border-radius:12px;min-height:40px}.song .remove{grid-column:2;grid-row:1}.icon-btn{background:#f4f0e9;color:#71808a;font-size:17px}.icon-btn:hover{background:#e9f3ef}.remove{font-size:15px!important;min-height:30px;width:30px}.remove:hover{background:#ffe8e5;color:#d76b62}.list-actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:13px}.add-btn,.reset-btn{padding:10px 16px;font-weight:700}.add-btn{background:var(--mint);color:#315f58}.add-btn::before{content:"＋ ";font-size:18px}.reset-btn{background:#f0e4f5;color:#805893}.reset-btn:hover{background:#dfc8f2;color:#62417a}.reset-confirm{display:flex;align-items:center;flex-wrap:wrap;gap:9px;color:var(--muted);font-size:13px}.reset-confirm[hidden]{display:none}.confirm-btn{min-height:32px;padding:5px 12px;background:#e887b1;color:#fff;font-weight:700}.confirm-btn.cancel{background:#f0e4f5;color:#805893}.empty{text-align:center;color:var(--muted);padding:20px 0;font-size:14px}.options{display:flex;flex-wrap:wrap;gap:15px;color:#71808a;font-size:13px}.check{display:flex;align-items:center;gap:7px;cursor:pointer}.check input{width:17px;height:17px;accent-color:var(--coral)}
.preview{margin-top:20px;padding:14px;border-radius:17px;background:linear-gradient(135deg,#fff9e6,#fff1ee);border:2px solid #fff}.preview-label{text-align:center;margin:0 0 8px;color:#9b8880;font-size:12px}.preview-stage{background:#fff;border-radius:12px;padding:20px;min-height:210px;display:flex;align-items:center;justify-content:center}.preview-stage .display{transform:scale(.65);transform-origin:center;min-width:480px}
.status{text-align:center;color:var(--muted);font-size:13px;min-height:20px;margin:15px 0 0}.obs{padding:0;background:transparent;overflow:hidden}.obs .shell{width:100vw;max-width:none}.obs .panel{padding:0;background:transparent;border:0!important;box-shadow:none!important;outline:0!important;border-radius:0!important}.obs .editor{display:none}.obs .preview{margin:0;padding:0;background:transparent;border:0;box-shadow:none;outline:0}.obs .preview-label{display:none}.obs .preview-stage{padding:0;background:transparent;min-height:100vh;border:0;box-shadow:none;outline:0}.obs .preview-stage .display{transform:none}.obs .display::before{display:none}html.obs,body.obs{background:transparent!important}
.display{width:530px;padding:24px 27px 22px;background:rgba(255,253,248,.96);border:3px solid #65747b;border-radius:24px;box-shadow:0 7px 0 rgba(101,116,123,.13),0 0 0 3px rgba(255,255,255,.9);text-align:center;position:relative}.display::before{content:"✦ ･ﾟ✧ ･ﾟ✧ ･ﾟ✧ ✦";position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:#f2b8a9;white-space:nowrap;font:18px Yomogi;letter-spacing:5px}.display-kicker{display:inline-block;padding:4px 17px;border-radius:999px;background:var(--coral);color:#fff;font:700 13px Yomogi;letter-spacing:.14em}.display-title{margin:12px 0 2px;color:#4e5966;font:700 28px Yomogi,"Zen Maru Gothic",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.display-subtitle{margin:0 0 14px;color:#84939a;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now{padding:14px 14px 12px;border-radius:17px;background:linear-gradient(135deg,#fff5bf,#fff0d5);border:2px solid #f6d778}.now-label{color:#a77a35;font-size:12px;font-weight:700;letter-spacing:.13em}.now-title{margin:4px 0 0;color:#5a5960;font:700 27px Yomogi,"Zen Maru Gothic",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-artist{color:#8f7d69;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next{margin-top:13px;text-align:left}.next-heading{display:flex;justify-content:space-between;color:#88949a;font-size:12px;font-weight:700;letter-spacing:.1em}.count{color:#d89583}.next-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed #ebdfd0}.next-row:last-child{border-bottom:0}.next-no{flex:0 0 25px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#dff2ec;color:#4f897d;font-size:12px;font-weight:700}.next-copy{min-width:0;flex:1}.next-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}.next-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9b8e88;font-size:11px}.next-time{color:#a78b78;font-size:12px}.empty-display{padding:17px;color:#9a8e88;font-size:13px}.finished{color:#6eaaa0}
@media(max-width:680px){body{padding:12px}.panel{padding:18px;border-radius:22px}.event-grid{grid-template-columns:1fr}.song{grid-template-columns:24px 32px minmax(0,1fr) 70px 32px 32px;gap:5px}.song .field:first-of-type input{font-size:16px;padding:11px 9px}.preview-stage{overflow:hidden}.preview-stage .display{transform:scale(.52)}.obs .preview-stage .display{transform:scale(.78)}.display{width:530px}}

:root{--ink:#273542;--muted:#71808b;--coral:#c66b55;--yellow:#e7bd67;--mint:#a8cbbb;--sky:#9fc5d4;--pink:#f1d6cc;--paper:#fbf7ef;--line:#ded2c2;--shadow:0 18px 45px rgba(50,37,28,.2)}

.field{color:#88766c}.field input,.field select,.song input{border-color:#dfd1be;background:#fffdf9}.field input:focus,.field select:focus,.song input:focus{border-color:#c99c58;box-shadow:0 0 0 3px rgba(201,156,88,.16)}

.icon-btn{background:#eee6d9;color:#80675b}.icon-btn:hover{background:#e3d0af;color:#62483d}.remove:hover{background:#f4d7cc;color:#a74f40}.add-btn{background:#789e91;color:#fff;box-shadow:0 5px 12px rgba(57,89,78,.2)}

.field{color:#9a789f}.field input,.field select,.song input{border-color:#ead8ea;background:#fffafe}.field input:focus,.field select:focus,.song input:focus{border-color:#c29ee7;box-shadow:0 0 0 3px rgba(194,158,231,.18)}

</style>

<body>
<main class="shell"><div class="panel">
  <section class="editor">
    <h1>リスト</h1>
    <div class="card"><h2>リスト情報</h2><div class="event-grid"><label class="field">イベント名<input id="eventTitle" maxlength="50" placeholder="例：おしながき"></label><label class="field">ひとこと<input id="eventSubtitle" maxlength="80" placeholder="例：ゆっくりしていってね"></label></div></div>
    <div class="card"><h2>リスト</h2><div id="songList"></div><div class="list-actions"><button id="addSong" class="add-btn" type="button">項目を追加</button><button id="resetSongs" class="reset-btn" type="button">項目をリセット</button><div id="resetConfirm" class="reset-confirm" hidden>項目数をリセットしますか？<button id="confirmReset" class="confirm-btn" type="button">はい</button><button id="cancelReset" class="confirm-btn cancel" type="button">いいえ</button></div></div></div>
    <div class="card"><h2>表示設定</h2><div class="options"><label class="check"><input id="showNext" type="checkbox" checked>次の項目を表示</label><label class="check"><input id="showFinished" type="checkbox">終了した項目も表示</label><label class="field">FINISHED表示数<select id="finishedCount"><option value="2">2曲</option><option value="3">3曲</option><option value="4">4曲</option><option value="5">5曲</option><option value="6">6曲</option><option value="7">7曲</option><option value="8">8曲</option><option value="9">9曲</option><option value="10">10曲</option></select></label></div></div>
    <p id="status" class="status">入力内容は自動保存されます</p>
  </section>
  <section class="preview"><p class="preview-label">表示プレビュー</p><div class="preview-stage"><div id="display" class="display"></div></div></section>
</div></main>
<script>
(()=>{
  'use strict';
  const KEY='set-list-html-only-v1',CHANNEL='set-list-html-only-channel-v1';
  const $=id=>document.getElementById(id),isObs=new URLSearchParams(location.search).get('obs')==='1';
  if(isObs){document.documentElement.classList.add('obs');document.body.classList.add('obs');}
  const defaults={eventTitle:'',eventSubtitle:'',showNext:true,showFinished:false,finishedCount:2,currentIndex:0,songs:[]};
  let state=load(),bc=null;
  try{bc=new BroadcastChannel(CHANNEL)}catch(e){}
  function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
  function save(){localStorage.setItem(KEY,JSON.stringify(state));if(bc)try{bc.postMessage(state)}catch(e){}}
  function adopt(next){if(next){state={...defaults,...next};render(false)}}
  if(bc)bc.onmessage=e=>adopt(e.data);window.addEventListener('storage',e=>{if(e.key===KEY)adopt(load())});
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function songRow(song,index){return `<div class="song ${index===state.currentIndex?'active':''}" data-index="${index}"><span class="song-number">${index+1}</span><button class="icon-btn remove" title="削除" type="button">×</button><label class="field"><span>項目名</span><input data-key="title" maxlength="60" value="${esc(song.title)}" placeholder="項目名"></label><label class="field"><span>備考</span><input data-key="duration" maxlength="8" value="${esc(song.duration)}" placeholder="1個"></label><button class="icon-btn up" title="上へ" type="button">↑</button><button class="icon-btn down" title="下へ" type="button">↓</button></div>`}
  function renderList(){if(!state.songs.length){$('songList').innerHTML='<p class="empty">まだ項目がありません。下のボタンから追加できます。</p>';return}$('songList').innerHTML=state.songs.map(songRow).join('')}
  function renderDisplay(target){const songs=state.songs, current=songs[state.currentIndex];let html=`<div class="display-title">${esc(state.eventTitle)||'本日のおしながき'}</div>`+(state.eventSubtitle?`<div class="display-subtitle">${esc(state.eventSubtitle)}</div>`:'');
    if(current){const title=esc(current.title)||'項目未入力',marqueeGroup=`<span class="now-title-group"><span class="now-title-copy">${title}</span><span class="now-title-gap">✦</span></span>`;html+=`<div class="now"><div class="now-label" data-position="${state.currentIndex+1} / ${songs.length}">NOW　${state.currentIndex+1} / ${songs.length}</div><div class="now-title-window"><span class="now-title-track">${marqueeGroup}${marqueeGroup}</span></div><div class="now-duration">${current.duration?esc(current.duration):''}</div></div>`}else html+='<div class="now"><div class="empty-display">項目を追加すると、ここに現在の項目が表示されます</div></div>';
    if(state.showFinished&&state.currentIndex>0){const done=songs.slice(0,state.currentIndex);html+='<div class="next"><div class="next-heading"><span>FINISHED</span><span class="count">'+done.length+'項目</span></div><div class="finished-list">';done.forEach((song,index)=>{html+=`<div class="next-row"><span class="next-no finished">${index+1}</span><span class="next-copy"><span class="next-name">${esc(song.title)||'項目未入力'}</span></span><span class="next-time">${esc(song.duration)}</span></div>`});html+='</div></div>'}
    if(state.showNext){const next=songs.slice(state.currentIndex+1).slice(0,3);html+='<div class="next"><div class="next-heading"><span>NEXT</span><span class="count">'+(songs.length?`${state.currentIndex+1} / ${songs.length}`:'')+'</span></div>';
      if(next.length)next.forEach((song,i)=>{const no=state.currentIndex+i+2;html+=`<div class="next-row"><span class="next-no">${no}</span><span class="next-copy"><span class="next-name">${esc(song.title)||'項目未入力'}</span></span><span class="next-time">${esc(song.duration)}</span></div>`});else html+='<div class="empty-display">この先の項目はありません</div>';html+='</div>'}
    target.innerHTML=html;
  }
  let finishedAnimationTimers=[],finishedAnimationFrames=[];
  function clearFinishedAnimations(){finishedAnimationTimers.forEach(timer=>clearTimeout(timer));finishedAnimationTimers=[];finishedAnimationFrames.forEach(frame=>cancelAnimationFrame(frame));finishedAnimationFrames=[]}
  function render(syncForm=true){clearFinishedAnimations();if(!isObs&&syncForm){$('eventTitle').value=state.eventTitle;$('eventSubtitle').value=state.eventSubtitle;$('showNext').checked=state.showNext;$('showFinished').checked=state.showFinished;$('finishedCount').value=String(Math.min(10,Math.max(2,state.finishedCount||2)));renderList()}renderDisplay($('display'));sizeFinishedLists();startFinishedAnimations()}
  function sizeFinishedLists(){document.querySelectorAll('.finished-list').forEach(list=>{const visible=Math.min(10,Math.max(2,Number(state.finishedCount)||2));list.style.maxHeight=(visible*42)+'px';list.scrollTop=0})}
  function animateFinishedList(list){if(list.scrollHeight<=list.clientHeight+2)return;list.scrollTop=0;const wait=window.setTimeout(()=>{const start=performance.now(),distance=list.scrollHeight-list.clientHeight;const move=now=>{const progress=Math.min(1,(now-start)/2000);list.scrollTop=distance*progress;if(progress<1){const frame=requestAnimationFrame(move);finishedAnimationFrames.push(frame);return}const reset=window.setTimeout(()=>{list.scrollTop=0;animateFinishedList(list)},2000);finishedAnimationTimers.push(reset)};const frame=requestAnimationFrame(move);finishedAnimationFrames.push(frame)},2000);finishedAnimationTimers.push(wait)}
  function animateNowTitle(track){const windowEl=track.parentElement,groups=track.querySelectorAll('.now-title-group');if(groups.length<2)return;const first=groups[0],second=groups[1],distance=second.offsetLeft;if(distance<=windowEl.clientWidth+2){const gap=first.querySelector('.now-title-gap');if(gap)gap.remove();second.remove();track.style.transform='translate3d(0,0,0)';return}const speed=34,hold=2000,move=distance/speed*1000;track.style.transform='translate3d(0,0,0)';const waitTimer=window.setTimeout(()=>{const started=performance.now(),moveFrame=now=>{const progress=Math.min(1,(now-started)/move);track.style.transform=`translate3d(${-distance*progress}px,0,0)`;if(progress<1){const frame=requestAnimationFrame(moveFrame);finishedAnimationFrames.push(frame);return}const endTimer=window.setTimeout(()=>{first.innerHTML=second.innerHTML;track.style.transform='translate3d(0,0,0)';animateNowTitle(track)},hold);finishedAnimationTimers.push(endTimer)};const frame=requestAnimationFrame(moveFrame);finishedAnimationFrames.push(frame)},hold);finishedAnimationTimers.push(waitTimer)}
  function startFinishedAnimations(){document.querySelectorAll('.finished-list').forEach(animateFinishedList);document.querySelectorAll('.now-title-track').forEach(animateNowTitle)}
  function update(fn){fn();save();render(false)}
  $('addSong').onclick=()=>{update(()=>{state.songs.push({title:'',duration:''});state.currentIndex=state.songs.length-1});render()};
  $('resetSongs').onclick=()=>{$('resetConfirm').hidden=false;$('resetSongs').disabled=true};
  $('cancelReset').onclick=()=>{$('resetConfirm').hidden=true;$('resetSongs').disabled=false};
  $('confirmReset').onclick=()=>{update(()=>{const resetCount=Math.min(10,Math.max(2,Number(state.finishedCount)||2));state.songs=Array.from({length:resetCount},()=>({title:'',duration:''}));state.currentIndex=0});$('resetConfirm').hidden=true;$('resetSongs').disabled=false;render()};
  $('eventTitle').oninput=e=>update(()=>state.eventTitle=e.target.value);$('eventSubtitle').oninput=e=>update(()=>state.eventSubtitle=e.target.value);
  $('showNext').onchange=e=>update(()=>state.showNext=e.target.checked);$('showFinished').onchange=e=>update(()=>state.showFinished=e.target.checked);$('finishedCount').onchange=e=>update(()=>state.finishedCount=Math.min(10,Math.max(2,Number(e.target.value)||2)));
  $('songList').addEventListener('input',e=>{const row=e.target.closest('.song');if(!row)return;const song=state.songs[Number(row.dataset.index)];update(()=>song[e.target.dataset.key]=e.target.value)});
  $('songList').addEventListener('click',e=>{const row=e.target.closest('.song');if(!row||e.target.tagName==='INPUT')return;const index=Number(row.dataset.index);update(()=>{if(e.target.classList.contains('remove')){state.songs.splice(index,1);state.currentIndex=Math.min(state.currentIndex,Math.max(0,state.songs.length-1))}else if(e.target.classList.contains('up')&&index>0){[state.songs[index-1],state.songs[index]]=[state.songs[index],state.songs[index-1]];state.currentIndex=index-1}else if(e.target.classList.contains('down')&&index<state.songs.length-1){[state.songs[index+1],state.songs[index]]=[state.songs[index],state.songs[index+1]];state.currentIndex=index+1}else{state.currentIndex=index}});render()});
  $('display').addEventListener('click',e=>{const row=e.target.closest('.next-row');if(!row)return});
  document.addEventListener('dblclick',e=>{if(isObs)return;const now=e.target.closest('.now');if(now&&state.songs.length)update(()=>state.currentIndex=(state.currentIndex+1)%state.songs.length)});
  render();
})();
</script>
</body>
</html>
