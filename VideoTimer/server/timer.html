<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同時視聴タイマー - OBS表示</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Yomogi&display=swap');

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"M PLUS Rounded 1c","Kosugi Maru",sans-serif;
}

.wrap{
  position:relative;
  min-width:510px;
  padding:27px 38px 25px;
  text-align:center;
  isolation:isolate;
}

/* ふわっとした白いプレート */
.wrap::before{
  content:"";
  position:absolute;
  inset:5px 8px;
  z-index:-2;
  border-radius:28px;
  background:
    linear-gradient(180deg,
      rgba(255,255,255,.96) 0%,
      rgba(250,248,253,.91) 100%);
  border:3px solid rgba(91,86,111,.72);
  box-shadow:
    0 7px 20px rgba(55,51,70,.20),
    0 0 0 2px rgba(255,255,255,.78),
    inset 0 0 0 2px rgba(218,210,231,.52),
    inset 0 -4px 0 rgba(202,190,220,.18);
}

/* てっぺんのレースっぽい飾り */
.wrap::after{
  content:"☘ ･ﾟ✧ ･ﾟ✧ ･ﾟ✧ ☘";
  position:absolute;
  left:50%;
  top:-7px;
  transform:translateX(-50%);
  width:88%;
  height:20px;
  overflow:hidden;
  white-space:nowrap;
  font-family:"Yomogi","Kosugi Maru",sans-serif;
  font-size:18px;
  letter-spacing:8px;
  line-height:18px;
  color:rgba(193,181,211,.78);
  text-shadow:
    0 2px 0 rgba(255,255,255,.95);
  z-index:3;
}

/* 小さなリボン */
.ribbon{
  position:absolute;
  left:50%;
  top:12px;
  transform:translateX(-50%);
  padding:4px 22px 5px;
  min-width:135px;
  border-radius:999px;
  background:linear-gradient(135deg,#9d7bc4,#c49add 52%,#e7a9c9);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 3px 8px rgba(88,80,110,.16);
  color:#fff;
  font-family:"Yomogi","Kosugi Maru",sans-serif;
  font-size:13px;
  letter-spacing:.14em;
  text-shadow:0 1px 2px rgba(67,61,84,.22);
}

.ribbon::before,
.ribbon::after{
  content:"";
  position:absolute;
  top:6px;
  width:17px;
  height:14px;
  background:#c3a7dc;
  z-index:-1;
}

.ribbon::before{
  left:-12px;
  clip-path:polygon(100% 0,0 25%,40% 50%,0 75%,100% 100%);
}

.ribbon::after{
  right:-12px;
  clip-path:polygon(0 0,100% 25%,60% 50%,100% 75%,0 100%);
}

.work-info{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:29px;
  padding-top:19px;
  margin-bottom:7px;
  color:#625f73;
  text-shadow:0 1px 0 rgba(255,255,255,.98);
}

.work-info #workTitle{
  max-width:380px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:"Yomogi","Kosugi Maru",sans-serif;
  font-size:28px;
  font-weight:700;
  letter-spacing:.05em;
}

.work-info #workEpisode{
  flex:none;
  padding:5px 13px 6px;
  border-radius:999px;
  background:linear-gradient(135deg,#eadfff,#f8e7f4);
  border:2px solid #b9a0d7;
  color:#704d88;
  box-shadow:0 2px 5px rgba(70,64,88,.10);
  font-family:"Yomogi","Kosugi Maru",sans-serif;
  font-size:18px;
  font-weight:700;
  letter-spacing:.04em;
}

/* 「同時視聴」 */
.label{
  display:inline-block;
  position:relative;
  margin-bottom:7px;
  padding:2px 17px 4px;
  border-radius:999px;
  background:linear-gradient(135deg,rgba(239,228,255,.95),rgba(255,238,247,.95));
  color:#80639a;
  border:1px solid rgba(187,157,216,.55);
  font-family:"Yomogi","Kosugi Maru",sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.16em;
  text-shadow:0 1px 0 #fff;
}

.label::before,
.label::after{
  content:"☘";
  position:absolute;
  top:2px;
  color:#b9aecb;
  font-size:11px;
}

.label::before{left:4px}
.label::after{right:4px}

/* メイン数字 */
.timer{
  font-family:"M PLUS Rounded 1c","Kosugi Maru",sans-serif;
  font-size:clamp(66px,9.5vw,108px);
  font-weight:500;
  line-height:1;
  letter-spacing:.055em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  color:#55596c;

  -webkit-text-stroke:3px rgba(255,255,255,.95);
  paint-order:stroke fill;
  text-shadow:
    0 2px 0 #fff,
    0 5px 0 rgba(210,202,222,.42),
    0 7px 12px rgba(76,71,94,.13);

  transition:
    color .25s ease,
    opacity .25s ease,
    transform .25s ease,
    filter .25s ease;
}

.timer.running{color:#6f5a86}

.timer.paused{
  color:#898895;
  filter:saturate(.72);
  opacity:.9;
}

.timer.preparing{
  color:#8061a0;
  animation:preparing 1s ease-in-out infinite alternate;
}

.timer.finished{
  color:#9896a0;
  animation:finished 1.1s ease-in-out infinite alternate;
}

.status{
  min-height:18px;
  margin-top:9px;
  font-family:"Yomogi","Kosugi Maru",sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.1em;
  color:#806c91;
  padding:5px 14px 6px;
  border-radius:999px;
  background:rgba(247,237,255,.88);
  border:1px solid rgba(188,160,218,.55);
  text-shadow:0 1px 0 #fff;
}

/* 四隅の小さな飾り */
.mini{
  position:absolute;
  z-index:4;
  color:#a47ac4;
  font-family:"Yomogi","Kosugi Maru",sans-serif;
  opacity:.85;
}

.mini.left{
  left:21px;
  top:38px;
  font-size:18px;
  transform:rotate(-12deg);
}

.mini.right{
  right:21px;
  top:40px;
  font-size:15px;
  transform:rotate(12deg);
}

@keyframes preparing{
  from{opacity:.68;transform:scale(.985)}
  to{opacity:1;transform:scale(1.012)}
}

@keyframes finished{
  from{opacity:.62}
  to{opacity:1}
}
</style>
</head>

<body>
<div class="wrap">
  <div class="ribbon">同時視聴</div>
  <span class="mini left">☘</span>
  <span class="mini right">✧ ☘</span>

  <div id="workInfo" class="work-info">
    <span id="workTitle">作品名</span>
    <span id="workEpisode">第1話</span>
  </div>
  <div id="label" class="label">経過時間</div>
  <div id="timer" class="timer">00:00:00</div>
  <div id="status" class="status">待機中</div>
</div>

<script>
const STATE_URL="/api/state";

const timerEl=document.getElementById("timer");
const labelEl=document.getElementById("label");
const statusEl=document.getElementById("status");
const workTitleEl=document.getElementById("workTitle");
const workEpisodeEl=document.getElementById("workEpisode");

let local={
  mode:"up",
  running:false,
  preparing:false,
  finished:false,
  currentSeconds:0,
  prepRemaining:0,
  workTitle:"",
  workEpisode:"",
  showEpisode:true
};

function fmt(x){
  x=Math.max(0,Math.floor(x));
  const h=Math.floor(x/3600);
  const m=Math.floor((x%3600)/60);
  const s=x%60;
  return [h,m,s]
    .map(v=>String(v).padStart(2,"0"))
    .join(":");
}

function draw(){
  workTitleEl.textContent=local.workTitle || "";
  workEpisodeEl.textContent=local.workEpisode || "";
  workTitleEl.style.display=local.workTitle ? "" : "none";
  workEpisodeEl.style.display=(local.showEpisode !== false && local.workEpisode) ? "" : "none";

  timerEl.textContent=fmt(
    local.preparing ? local.prepRemaining : local.currentSeconds
  );

  timerEl.className="timer";

  if(local.preparing){
    timerEl.classList.add("preparing");
  }else if(local.finished){
    timerEl.classList.add("finished");
  }else if(!local.running && local.currentSeconds>0){
    timerEl.classList.add("paused");
  }else if(local.running){
    timerEl.classList.add("running");
  }

  labelEl.textContent=
    local.preparing ? "準備中" :
    local.finished ? "終了" :
    (local.mode==="up" ? "経過時間" : "残り時間");

  statusEl.textContent=
    local.preparing ? "準備中…" :
    local.finished ? "00:00:00 到達" :
    local.running ?
      "視聴中" :
      (local.currentSeconds>0 ? "一時停止中" : "待機中");
}

async function sync(){
  try{
    const r=await fetch(STATE_URL+"?t="+Date.now(),{
      cache:"no-store"
    });

    if(r.ok){
      local=await r.json();
      draw();
    }
  }catch(e){
    // OBS起動直後など、一時的な読み込み失敗は無視
  }
}

draw();
sync();
setInterval(sync,100);
</script>
</body>
</html>
